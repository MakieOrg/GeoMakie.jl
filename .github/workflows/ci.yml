name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read
jobs:
  test:
    name: Tests, Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'lts'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      # Cancel ongoing CI test runs if pushing to branch again before the previous tests
      # have finished
      - name: Cancel ongoing test runs for previous commits
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      # Do tests
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # Makie's ReferenceTests is not registered; adding it to the package's
      # environment makes it loadable inside Pkg.test, which turns on the
      # reference-image gallery (test/refimages).  Only on the latest Julia,
      # so the LTS job stays a plain package test.
      - name: Add ReferenceTests for the reference-image gallery
        if: matrix.version == '1'
        run: >
          julia --project=. -e 'using Pkg;
          Pkg.add(url = "https://github.com/MakieOrg/Makie.jl", subdir = "ReferenceTests", rev = "a76df399a4ee8631ee3ba6587ca052dd902dfe74")'
      - uses: julia-actions/julia-runtest@v1
        env: 
          DISPLAY: ':0'
        with: 
          prefix: xvfb-run -s '-screen 0 1024x768x24'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test_images-${{ matrix.version }}
          path: test_images/
  refimages:
    # After a green test run on master, the recorded gallery becomes the
    # reference set for this minor version: test/refimages/upload.jl attaches
    # it as reference_images.tar to the release `refimages-<major.minor>`
    # (created when missing), which compare.jl downloads on every run.
    name: Upload reference images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: test_images-1
          path: test_images/
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Upload the recorded gallery to the refimages release
        run: |
          julia -e 'using Pkg; Pkg.add(["ghr_jll", "TOML"])'
          julia test/refimages/upload.jl test_images/refimages/recorded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    steps:
      - name: Install binary dependencies
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - uses: actions/checkout@v7
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v8
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install documentation dependencies
        run: |
          xvfb-run -s '-screen 0 1024x768x24' julia --project=docs -e '
            using Pkg
            Pkg.instantiate()'
        env:
          DISPLAY: ':0'
          DATADEPS_ALWAYS_ACCEPT: 'true'
          RASTERDATASOURCES_PATH: '~/.julia/artifacts/RasterDataSources'
      - uses: julia-actions/julia-docdeploy@v1
        with:
          prefix: xvfb-run
          install-package: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
          DISPLAY: ':0'
          DATADEPS_ALWAYS_ACCEPT: 'true'
          RASTERDATASOURCES_PATH: '~/.julia/artifacts/RasterDataSources'
